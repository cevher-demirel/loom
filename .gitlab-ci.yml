# .gitlab-ci.yml -- mirrors .github/workflows/tests.yml (GitHub Actions no longer run). Image tag UNVERIFIED until the first pipeline runs.
# 576 non-browser tests ~4 min, 392 browser tests ~22 min. The fast job runs on every branch push (so a branch that has a
# merge request always gets a pipeline, even if the branch was pushed before the MR existed); the browser job runs on main
# and can be started by hand from any other branch's pipeline (play button), to protect the 400 free compute minutes/month.
# Do NOT add production secrets (Turso, Anthropic, Google, ...) as CI/CD variables: the suite uses placeholders and mocks only.
stages: [test]

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

default:
  # UNVERIFIED tag: check it exists (Playwright publishes versioned python images). Fallback: image python:3.12 and add
  # `pip install playwright==1.56.0 && playwright install --with-deps chromium` to the browser job (~2 more minutes).
  image: mcr.microsoft.com/playwright/python:v1.56.0-noble
  cache:
    key: pip
    paths: [.cache/pip]

variables:
  PIP_BREAK_SYSTEM_PACKAGES: "1"   # Ubuntu 24.04 images refuse a plain `pip install` (PEP 668) without this
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  ANTHROPIC_API_KEY: "sk-ant-test-placeholder"   # placeholders only; the suite never calls the real services
  VOYAGE_API_KEY: "voyage-test-placeholder"

tests-fast:
  stage: test
  script:
    - pip install -r requirements-dev.txt
    - pytest -q -m "not browser"
  rules:
    - if: $CI_COMMIT_BRANCH

tests-browser:
  stage: test
  variables:
    REQUIRE_BROWSER: "1"
  script:
    - pip install -r requirements-dev.txt playwright==1.56.0
    - pytest -q -m browser
  timeout: 40m
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
