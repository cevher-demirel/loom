name: Stage 8 — isolated visual screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/stage8-phase-d-40641607602
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated sample-data preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          html = p.read_text()
          original = 'var API_BASE = "https://loom-phas.onrender.com";'
          assert original in html, "Backend address changed; refusing to make unsafe preview"
          html = html.replace(original, 'var API_BASE = "http://127.0.0.1:9";')
          demo = """
          setTimeout(function () {
            try {
            currentDreams = [
              {id:101, title:"The Quiet Forest", text:"A fox appeared near the river.", tags:["fox","river","moon"], symbols:["fox","river","moon"], emotions:["wonder","peace"], people:["friend"], settings:["forest"]},
              {id:102, title:"The Blue Door", text:"A door opened onto a mountain.", tags:["door","mountain","stars"], symbols:["door","mountain","stars"], emotions:["curiosity"], people:["friend"], settings:["mountain"]},
              {id:103, title:"The Garden", text:"A bird flew over a garden.", tags:["bird","garden","moon"], symbols:["bird","garden","moon"], emotions:["joy","peace"], people:["sister"], settings:["garden"]},
              {id:104, title:"The Lantern", text:"A lantern floated over water.", tags:["lantern","water","stars"], symbols:["lantern","water","stars"], emotions:["wonder"], people:["sister"], settings:["lake"]}
            ];
            hasEnteredApp = true;
            showAppScreen(true);
            showTab("symbols");
            renderLoomGraph();
            document.documentElement.dataset.previewReady = "yes";
            } catch (err) {
              document.documentElement.dataset.previewError = String(err && (err.stack || err.message) || err);
              console.error("Preview setup failed:", err);
            }
          }, 250);
          """
          anchor = "})();\n</script>\n</body>"
          assert anchor in html, "Expected app closure not found"
          html = html.replace(anchor, demo + "\n})();\n</script>\n</body>", 1)
          Path("preview.html").write_text(html)
          PY
      - name: Install screenshot tooling
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture desktop and mobile screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import urllib.parse
          uri = Path("preview.html").resolve().as_uri()
          Path("preview-shots").mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for label, width, height in [("desktop",1440,900),("mobile",390,844)]:
                  page = browser.new_page(viewport={"width":width,"height":height}, device_scale_factor=1)
                  page.route("**/*", lambda route: route.continue_() if route.request.url.startswith("file:") else route.abort())
                  errors = []
                  page.on("pageerror", lambda error: errors.append(str(error)))
                  page.on("console", lambda msg: errors.append("console: " + msg.text) if msg.type == "error" else None)
                  try:
                      page.goto(uri, wait_until="domcontentloaded")
                      page.wait_for_function("document.documentElement.dataset.previewReady === 'yes' || !!document.documentElement.dataset.previewError", timeout=12000)
                      page.wait_for_function("document.querySelector('.splash-screen') === null || document.querySelector('.splash-screen').hidden || getComputedStyle(document.querySelector('.splash-screen')).display === 'none'", timeout=10000)
                      page.wait_for_timeout(400)
                  except Exception as exc:
                      errors.append("wait failure: " + str(exc))
                  state = page.evaluate("({ready:document.documentElement.dataset.previewReady,error:document.documentElement.dataset.previewError,nodes:document.querySelectorAll('#loom-graph-nodes > *').length})")
                  Path(f"preview-shots/diagnostics-{label}.txt").write_text(str(state) + "\n" + "\n".join(errors))
                  page.screenshot(path=f"preview-shots/loom-map-{label}.png", full_page=True)
                  if state.get("ready") != "yes" or state.get("nodes", 0) == 0:
                      raise RuntimeError(f"Preview did not render graph for {label}: {state}")
                  print(label, state, errors[-8:])
                  page.close()
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage8-isolated-visual-preview
          path: |
            preview-shots/*
            preview.html
          retention-days: 7
