name: Claude Pilot (manual, read-only)

# Intentionally no push, issue, PR, or schedule triggers.
# A workflow committed only to this setup branch will not run until
# separately reviewed and made available through the repository default branch.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: loom-claude-pilot
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only Claude connection test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code without persisted GitHub credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Read-only API metadata requests: no model inference or token usage.
      # Print only HTTP status codes; never print the key or API response body.
      - name: Verify Anthropic API key and selected model availability
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get("ANTHROPIC_API_KEY", "")
          if not key:
              print("ANTHROPIC_API_KEY secret is missing or empty.")
              sys.exit(1)

          headers = {
              "x-api-key": key,
              "anthropic-version": "2023-06-01",
          }
          checks = (
              ("API key authentication", "https://api.anthropic.com/v1/models"),
              ("Configured Sonnet model", "https://api.anthropic.com/v1/models/claude-sonnet-4-5"),
          )
          for label, url in checks:
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=12) as response:
                      status = response.status
              except urllib.error.HTTPError as exc:
                  status = exc.code
              except (urllib.error.URLError, TimeoutError):
                  print(f"{label}: connection failed (no response body printed).")
                  sys.exit(1)
              print(f"{label}: HTTP {status}")
              if status != 200:
                  print("Stopping before Claude execution; inspect API key, workspace access, or model availability.")
                  sys.exit(1)
          PY

      - name: Inspect repository with Claude Sonnet
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            This is a small, read-only connection test for Loominous.
            Read CLAUDE.md and inspect only README.md, index.html,
            main.py, database.py, and tests/ if present.
            Do not edit files, run shell commands, access networks,
            or call live services.
            Summarize the architecture in at most 250 words and
            recommend ONE low-risk next development task.
            Explicitly confirm that no code was changed.
          claude_args: |
            --model claude-sonnet-4-5
            --max-turns 4
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Edit,Write,MultiEdit,Bash,NotebookEdit,WebFetch,WebSearch"
