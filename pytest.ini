[pytest]
# Makes "import database", "import engine", "import main" work from any
# test file regardless of where pytest is invoked from, without needing
# an __init__.py in tests/ or installing the project as a package.
pythonpath = .
testpaths = tests
markers =
    browser: drives the real index.html in Chromium (needs Playwright)
    seed: Stage 30 env tests that start with the synthetic seed account
